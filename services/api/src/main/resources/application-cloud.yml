server:
  address: 0.0.0.0
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    hikari:
      # Cloud Run instances can scale horizontally. Keep each instance's pool
      # deliberately small and use Supabase's transaction pooler in production.
      maximum-pool-size: ${NOTEFLOW_DB_MAX_POOL_SIZE:5}
      minimum-idle: ${NOTEFLOW_DB_MIN_IDLE:0}
      idle-timeout: ${NOTEFLOW_DB_IDLE_TIMEOUT_MS:60000}
  data:
    redis:
      url: ${REDIS_URL}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_JWT_ISSUER:${SUPABASE_URL}/auth/v1}
          jwk-set-uri: ${SUPABASE_JWKS_URI:${SUPABASE_URL}/auth/v1/.well-known/jwks.json}
          audiences: ${SUPABASE_JWT_AUDIENCE:authenticated}

management:
  tracing:
    sampling:
      probability: ${NOTEFLOW_TRACE_SAMPLING_PROBABILITY:0.1}

noteflow:
  cors:
    allowed-origin-patterns: ${NOTEFLOW_ALLOWED_ORIGINS}
  security:
    internal-token: ${NOTEFLOW_INTERNAL_TOKEN}
