[project]
name = "noteflow-worker"
version = "0.1.0"
description = "Local NoteFlow document and agent worker"
requires-python = ">=3.11,<3.15"
dependencies = [
    "langgraph==1.2.10",
    "langgraph-checkpoint==4.1.1",
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
    "opentelemetry-instrumentation-psycopg>=0.51b0,<1",
    "opentelemetry-instrumentation-redis>=0.51b0,<1",
    "opentelemetry-sdk>=1.30,<2",
    "prometheus-client>=0.21,<1",
  "pillow==12.3.0",
    "psycopg[binary,pool]==3.3.4",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "pymupdf==1.28.0",
  "pypdf==6.14.2",
    "pytesseract==0.3.13",
    "redis==6.4.0",
]

[tool.uv]
package = false
